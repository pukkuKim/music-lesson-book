{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="csrf-token" content="{{ csrf_token }}">
        <title>Music Lesson Book</title>
        <link rel="stylesheet" href="{% static 'lessons/style.css' %}">
    </head>
    <body>
        <header class="topbar">
            <span class="brand">🎹 Music Lesson Book</span>
            {% if user.is_authenticated %}
                <form method="post"
                      action="{% url 'logout' %}">{% csrf_token %}<button class="link"
                                                                          type="submit">Log out</button></form>
            {% endif %}
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
        {% block scripts %}{% endblock %}
    </body>
</html>
